<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <title>Mes transactions - HBD</title>

  <style>
    :root {
      --navy: #0b1a8c;
      --navy-dark: #081268;
      --navy-deep: #050c4a;
      --navy-soft: rgba(11, 26, 140, .08);
      --navy-tint: #eef1fb;
      --ink: #0f172a;
      --muted: #64748b;
      --faint: #94a3b8;
      --line: #e6eaf3;
      --bg: #f3f5fb;
      --white: #ffffff;
      --green: #067647;
      --green-bg: #ecfdf3;
      --red: #b42318;
      --red-bg: #fef3f2;
      --amber: #b54708;
      --amber-bg: #fffaeb;
      --nav-h: 68px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    button { font-family: inherit; }

    .app {
      position: relative;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
    }

    svg.i {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    /* ---------- En-tête ---------- */
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, .96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .top::before {
      content: "";
      display: block;
      height: 4px;
      background: var(--navy);
    }

    .top-inner {
      position: relative;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn {
      position: absolute;
      top: 11px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 12px;
      background: var(--navy-tint);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    .icon-btn:active { transform: scale(.94); }
    .icon-btn.left { left: 14px; }
    .icon-btn.right { right: 14px; }
    .icon-btn .i { width: 20px; height: 20px; }

    .icon-btn.spin .i { animation: spin .8s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .logo {
      height: 46px;
      width: auto;
      max-width: 50%;
      object-fit: contain;
      display: block;
    }

    .content { padding: 18px 16px 8px; }

    .page-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.3px;
      margin-bottom: 14px;
    }

    /* ---------- Carte synthèse ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 20px 20px 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 60%, var(--navy-deep) 100%);
      box-shadow: 0 16px 34px rgba(11, 26, 140, .28);
      margin-bottom: 16px;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .hero::before {
      width: 220px;
      height: 220px;
      right: -75px;
      top: -95px;
      background: rgba(255, 255, 255, .06);
    }

    .hero::after {
      width: 140px;
      height: 140px;
      left: -50px;
      bottom: -85px;
      background: rgba(255, 255, 255, .05);
    }

    .hero > * { position: relative; z-index: 1; }

    .hero-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hero-label {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, .78);
    }

    .eye-btn {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .eye-btn .i { width: 18px; height: 18px; }

    .hero-balance {
      margin-top: 6px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }

    .hero-value {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .hero-unit {
      font-size: 15px;
      font-weight: 700;
      color: rgba(255, 255, 255, .75);
    }

    .flows {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .flow {
      background: rgba(255, 255, 255, .11);
      border-radius: 14px;
      padding: 11px 12px;
      min-width: 0;
    }

    .flow-top {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, .78);
    }

    .flow-dot {
      width: 20px;
      height: 20px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flow-dot .i { width: 12px; height: 12px; stroke-width: 2.6; }
    .flow-dot.in { background: rgba(74, 222, 128, .22); color: #86efac; }
    .flow-dot.out { background: rgba(248, 113, 113, .22); color: #fca5a5; }

    .flow-value {
      margin-top: 6px;
      font-size: 15.5px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-foot {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, .16);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: rgba(255, 255, 255, .72);
    }

    .hero-foot strong {
      color: #fff;
      font-weight: 700;
    }

    /* ---------- Recherche ---------- */
    .search {
      position: relative;
      margin-bottom: 10px;
    }

    .search .i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--faint);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      background: var(--white);
      padding: 0 14px 0 42px;
      font-family: inherit;
      font-size: 16px;
      color: var(--ink);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .search input::placeholder { color: #9aa5b8; }

    .search input:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3.5px var(--navy-soft);
    }

    /* ---------- Filtres ---------- */
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 16px 12px;
      margin: 0 -16px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .chip {
      flex: none;
      border: 1.5px solid var(--line);
      background: var(--white);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }

    .chip.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }

    /* ---------- Liste ---------- */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 2px 10px;
    }

    .section-head h2 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.2px;
    }

    .count {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .day-title {
      margin: 16px 4px 8px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--faint);
    }

    .day-title:first-child { margin-top: 2px; }

    .day-group {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .04);
    }

    .transaction {
      border-bottom: 1px solid #f0f2f8;
      cursor: pointer;
    }

    .transaction:last-child { border-bottom: 0; }

    .tx-main {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      transition: background .12s;
    }

    .transaction:active .tx-main { background: var(--bg); }

    .tx-icon {
      width: 42px;
      height: 42px;
      flex: none;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tx-icon .i { width: 19px; height: 19px; }

    .tx-icon.credit { background: var(--green-bg); color: var(--green); }
    .tx-icon.debit { background: var(--red-bg); color: var(--red); }
    .tx-icon.neutral { background: var(--navy-tint); color: var(--navy); }

    .tx-info { flex: 1; min-width: 0; }

    .tx-label {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-sub {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-amount {
      flex: none;
      text-align: right;
    }

    .amount {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .amount.credit { color: var(--green); }
    .amount.debit { color: var(--red); }
    .amount.neutral { color: var(--ink); }

    .pill {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
    }

    .pill.success { background: var(--green-bg); color: var(--green); }
    .pill.pending { background: var(--amber-bg); color: var(--amber); }
    .pill.rejected { background: var(--red-bg); color: var(--red); }
    .pill.other { background: #eef1f6; color: var(--muted); }

    .tx-extra {
      display: none;
      padding: 0 14px 14px;
    }

    .transaction.open .tx-extra { display: block; }

    .details {
      background: var(--bg);
      border-radius: 14px;
      padding: 4px 13px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid #e4e8f3;
      font-size: 12.5px;
    }

    .detail-row:last-child { border-bottom: 0; }

    .detail-row span:first-child {
      color: var(--muted);
      flex: none;
    }

    .detail-row span:last-child,
    .detail-row .val {
      font-weight: 700;
      text-align: right;
      word-break: break-word;
      min-width: 0;
    }

    .ref-line {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }

    .copy-ref {
      flex: none;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: var(--white);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .copy-ref .i { width: 14px; height: 14px; }

    .description {
      margin-top: 8px;
      padding: 11px 13px;
      border-radius: 12px;
      background: var(--navy-tint);
      color: #475569;
      font-size: 12.5px;
      line-height: 1.5;
    }

    .chev {
      width: 16px;
      height: 16px;
      flex: none;
      color: #c2c9da;
      transition: transform .2s;
    }

    .transaction.open .chev { transform: rotate(90deg); }

    .more {
      width: 100%;
      margin-top: 16px;
      height: 48px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: var(--white);
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .more:active { transform: scale(.98); }

    /* ---------- États ---------- */
    .skeleton {
      display: block;
      border-radius: 8px;
      background: linear-gradient(90deg, #eceff7 25%, #f6f8fc 50%, #eceff7 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite linear;
    }

    @keyframes shimmer { to { background-position: -200% 0; } }

    .skel-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid #f0f2f8;
    }

    .skel-row:last-child { border-bottom: 0; }

    .empty {
      background: var(--white);
      border: 1.5px dashed #cfd6ea;
      border-radius: 20px;
      padding: 40px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: var(--navy-tint);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon .i { width: 26px; height: 26px; }

    .empty-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .empty-text {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--muted);
    }

    .error-box {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid #fecdca;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .error-box.show { display: flex; }

    .error-box button {
      flex: none;
      border: 0;
      background: var(--red);
      color: #fff;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 12px);
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 120;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ---------- Navigation ---------- */
    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(255, 255, 255, .97);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      display: flex;
      z-index: 50;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
      position: relative;
    }

    .nav-item .i { width: 22px; height: 22px; }
    .nav-item.active { color: var(--navy); }

    .nav-item.active::before {
      content: "";
      position: absolute;
      top: 0;
      width: 28px;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: var(--navy);
    }

    [hidden] { display: none !important; }

    @media (min-width: 481px) {
      body { background: #e9edf8; }
      .app { box-shadow: 0 0 50px rgba(11, 26, 140, .10); }
    }

    @media (max-width: 360px) {
      .hero-value { font-size: 29px; }
      .flow-value { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="top">
    <div class="top-inner">
      <a href="moi.html" class="icon-btn left" aria-label="Retour">
        <svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </a>

      <img
        id="logo"
        class="logo"
        src="https://uzgvaqewovipxorucjut.supabase.co/functions/v1/platform-logo"
        alt="HBD"
      >

      <button type="button" class="icon-btn right" id="refreshBtn" aria-label="Actualiser">
        <svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <main class="content">

    <h1 class="page-title">Mes transactions</h1>

    <div id="errorBox" class="error-box" role="alert">
      <span id="errorText"></span>
      <button type="button" id="retryBtn">Réessayer</button>
    </div>

    <!-- SYNTHÈSE -->
    <section class="hero">

      <div class="hero-head">
        <span class="hero-label">Solde disponible</span>
        <button type="button" class="eye-btn" id="eyeBtn" aria-label="Masquer le solde"></button>
      </div>

      <div class="hero-balance">
        <span class="hero-value" id="balance">—</span>
        <span class="hero-unit">FCFA</span>
      </div>

      <div class="flows">
        <div class="flow">
          <div class="flow-top">
            <span class="flow-dot in"><svg class="i" viewBox="0 0 24 24"><path d="M17 7L7 17M17 17H7V7"/></svg></span>
            Entrées
          </div>
          <div class="flow-value" id="totalIn">—</div>
        </div>

        <div class="flow">
          <div class="flow-top">
            <span class="flow-dot out"><svg class="i" viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg></span>
            Sorties
          </div>
          <div class="flow-value" id="totalOut">—</div>
        </div>
      </div>

      <div class="hero-foot">
        <span>Opérations : <strong id="totalTransactions">—</strong></span>
        <span>Dernière : <strong id="lastActivity">—</strong></span>
      </div>

    </section>

    <!-- RECHERCHE + FILTRES -->
    <div class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input
        id="search"
        type="search"
        placeholder="Rechercher une opération ou une référence"
        autocomplete="off"
        enterkeyhint="search"
      >
    </div>

    <div class="filters" id="filters" role="tablist" aria-label="Filtres">
      <button type="button" class="chip active" data-filter="all">Tout</button>
      <button type="button" class="chip" data-filter="credit">Crédits</button>
      <button type="button" class="chip" data-filter="debit">Débits</button>
      <button type="button" class="chip" data-filter="deposit">Dépôts</button>
      <button type="button" class="chip" data-filter="withdrawal">Retraits</button>
      <button type="button" class="chip" data-filter="income">Revenus</button>
      <button type="button" class="chip" data-filter="commission">Commissions</button>
      <button type="button" class="chip" data-filter="purchase">Achats</button>
    </div>

    <!-- HISTORIQUE -->
    <div class="section-head">
      <h2>Historique</h2>
      <span id="visibleCount" class="count">Chargement…</span>
    </div>

    <div id="transactions" aria-live="polite">
      <div class="day-group">
        <div class="skel-row"><span class="skeleton" style="width:42px;height:42px;border-radius:13px"></span><div style="flex:1"><span class="skeleton" style="width:55%;height:12px"></span><span class="skeleton" style="width:35%;height:9px;margin-top:8px"></span></div><span class="skeleton" style="width:64px;height:13px"></span></div>
        <div class="skel-row"><span class="skeleton" style="width:42px;height:42px;border-radius:13px"></span><div style="flex:1"><span class="skeleton" style="width:48%;height:12px"></span><span class="skeleton" style="width:30%;height:9px;margin-top:8px"></span></div><span class="skeleton" style="width:64px;height:13px"></span></div>
        <div class="skel-row"><span class="skeleton" style="width:42px;height:42px;border-radius:13px"></span><div style="flex:1"><span class="skeleton" style="width:60%;height:12px"></span><span class="skeleton" style="width:38%;height:9px;margin-top:8px"></span></div><span class="skeleton" style="width:64px;height:13px"></span></div>
      </div>
    </div>

    <button type="button" class="more" id="moreBtn" hidden>Afficher plus</button>

  </main>

  <div id="toast" class="toast" role="status"></div>

  <nav class="bottom-nav" aria-label="Navigation principale">

    <a href="dashboard.html" class="nav-item">
      <svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V11z"/></svg>
      Accueil
    </a>

    <a href="produits.html" class="nav-item">
      <svg class="i" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
      Produits
    </a>

    <a href="equipe.html" class="nav-item">
      <svg class="i" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87M15 3.13a4 4 0 0 1 0 7.75"/></svg>
      Équipe
    </a>

    <a href="moi.html" class="nav-item active">
      <svg class="i" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Moi
    </a>

  </nav>

</div>

<script>
  const FUNCTIONS_BASE = "https://uzgvaqewovipxorucjut.supabase.co/functions/v1";
  const DASHBOARD_URL = FUNCTIONS_BASE + "/dashboard";
  const LOGIN_PAGE = "login.html";
  const PAGE_SIZE = 20;

  const sessionToken = sessionStorage.getItem("hbd_session_token");

  const $ = (id) => document.getElementById(id);

  let allTransactions = [];
  let balance = null;
  let currentFilter = "all";
  let query = "";
  let limit = PAGE_SIZE;
  let hidden = sessionStorage.getItem("hbd_hide_balance") === "1";
  let loaded = false;

  /* ---------------- Icônes ---------------- */

  const ICON = {
    eye: '<svg class="i" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg class="i" viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
    deposit: '<svg class="i" viewBox="0 0 24 24"><path d="M17 7L7 17M17 17H7V7"/></svg>',
    withdrawal: '<svg class="i" viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg>',
    income: '<svg class="i" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>',
    commission: '<svg class="i" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87M15 3.13a4 4 0 0 1 0 7.75"/></svg>',
    purchase: '<svg class="i" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
    gift: '<svg class="i" viewBox="0 0 24 24"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>',
    refund: '<svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><path d="M3 3v6h6"/><path d="M12 8v4l3 2"/></svg>',
    other: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/></svg>',
    copy: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
    chev: '<svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
    empty: '<svg class="i" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>'
  };

  /* ---------------- Utilitaires ---------------- */

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatNumber(value) {
    return new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 })
      .format(Math.abs(Number(value || 0)));
  }

  function parseDate(value) {
    if (!value) return null;
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function formatFull(value) {
    const date = parseDate(value);
    if (!date) return "Date inconnue";

    return date.toLocaleString("fr-FR", {
      day: "2-digit",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function formatTime(value) {
    const date = parseDate(value);
    if (!date) return "";
    return date.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  function formatShort(value) {
    const date = parseDate(value);
    if (!date) return "—";

    return date.toLocaleString("fr-FR", {
      day: "2-digit",
      month: "short",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function dayKey(value) {
    const date = parseDate(value);
    if (!date) return "unknown";
    return date.getFullYear() + "-" + (date.getMonth() + 1) + "-" + date.getDate();
  }

  function dayLabel(value) {
    const date = parseDate(value);
    if (!date) return "Date inconnue";

    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);

    if (dayKey(date) === dayKey(today)) return "Aujourd'hui";
    if (dayKey(date) === dayKey(yesterday)) return "Hier";

    return date.toLocaleDateString("fr-FR", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });
  }

  let toastTimer = null;

  function toast(text) {
    const el = $("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast("Référence copiée");
    } catch {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();

      let ok = false;
      try { ok = document.execCommand("copy"); } catch { ok = false; }

      area.remove();
      toast(ok ? "Référence copiée" : "Copie impossible");
    }
  }

  /* ---------------- Normalisation des transactions ---------------- */

  const KIND_LABELS = {
    deposit: "Dépôt",
    withdrawal: "Retrait",
    income: "Revenu",
    commission: "Commission",
    purchase: "Achat",
    gift: "Cadeau",
    refund: "Remboursement",
    other: "Opération"
  };

  function kindOf(tx) {
    const raw = String(tx.kind || tx.type || "").toLowerCase();

    if (raw.includes("deposit") || raw.includes("depot") || raw.includes("recharge")) return "deposit";
    if (raw.includes("withdraw") || raw.includes("retrait")) return "withdrawal";
    if (raw.includes("purchase") || raw.includes("achat")) return "purchase";
    if (raw.includes("commission") || raw.includes("referral") || raw.includes("parrain")) return "commission";
    if (raw.includes("income") || raw.includes("revenu")) return "income";
    if (raw.includes("bonus") || raw.includes("gift") || raw.includes("cadeau")) return "gift";
    if (raw.includes("refund") || raw.includes("remboursement")) return "refund";

    return "other";
  }

  function normalize(tx) {
    const rawAmount = Number(tx.amount || 0);
    const direction = String(tx.direction || "").toLowerCase();

    let signed = rawAmount;

    if (direction === "debit") signed = -Math.abs(rawAmount);
    else if (direction === "credit") signed = Math.abs(rawAmount);

    const kind = kindOf(tx);

    return {
      raw: tx,
      kind,
      signed,
      dir: signed > 0 ? "credit" : signed < 0 ? "debit" : "neutral",
      label: tx.label || tx.description || KIND_LABELS[kind],
      description: tx.description || "",
      status: String(tx.status || "").toLowerCase(),
      statusRaw: tx.status,
      reference: tx.reference_code || tx.reference_id || "",
      balanceAfter: tx.balance_after,
      date: tx.created_at
    };
  }

  function statusInfo(status, rawStatus) {
    if (["success", "completed", "paid", "approved", "confirmed"].includes(status)) {
      return { cls: "success", text: status === "paid" ? "Payée" : "Confirmée" };
    }

    if (["pending", "processing"].includes(status)) {
      return { cls: "pending", text: status === "pending" ? "En attente" : "En traitement" };
    }

    if (["rejected", "failed", "cancelled", "canceled"].includes(status)) {
      return {
        cls: "rejected",
        text: status === "rejected" ? "Rejetée" : status === "failed" ? "Échouée" : "Annulée"
      };
    }

    return { cls: "other", text: rawStatus ? String(rawStatus) : "Enregistrée" };
  }

  function matchesFilter(tx) {
    switch (currentFilter) {
      case "all": return true;
      case "credit": return tx.dir === "credit";
      case "debit": return tx.dir === "debit";
      default: return tx.kind === currentFilter;
    }
  }

  function matchesQuery(tx) {
    if (!query) return true;

    const haystack = [
      tx.label,
      tx.description,
      tx.reference,
      KIND_LABELS[tx.kind]
    ].join(" ").toLowerCase();

    return haystack.includes(query);
  }

  /* ---------------- Synthèse ---------------- */

  function renderBalance() {
    $("balance").textContent =
      balance === null ? "—" : hidden ? "••••••" : formatNumber(balance);

    $("eyeBtn").innerHTML = hidden ? ICON.eyeOff : ICON.eye;
    $("eyeBtn").setAttribute("aria-label", hidden ? "Afficher le solde" : "Masquer le solde");

    if (loaded) {
      const failed = ["rejected", "failed", "cancelled", "canceled"];

      let totalIn = 0;
      let totalOut = 0;

      allTransactions.forEach(tx => {
        if (failed.includes(tx.status)) return;
        if (tx.signed > 0) totalIn += tx.signed;
        if (tx.signed < 0) totalOut += Math.abs(tx.signed);
      });

      $("totalIn").textContent = hidden ? "••••" : "+" + formatNumber(totalIn) + " FCFA";
      $("totalOut").textContent = hidden ? "••••" : "-" + formatNumber(totalOut) + " FCFA";
    }
  }

  $("eyeBtn").addEventListener("click", () => {
    hidden = !hidden;
    sessionStorage.setItem("hbd_hide_balance", hidden ? "1" : "0");
    renderBalance();
    renderList();
  });

  /* ---------------- Liste ---------------- */

  function transactionHtml(tx) {
    const iconKey = tx.kind === "other" ? "other" : tx.kind;
    const status = statusInfo(tx.status, tx.statusRaw);

    const sign = tx.signed > 0 ? "+" : tx.signed < 0 ? "-" : "";
    const amountText = hidden
      ? "••••"
      : sign + formatNumber(tx.signed) + " FCFA";

    const time = formatTime(tx.date);
    const sub = KIND_LABELS[tx.kind] + (time ? " · " + time : "");

    const balanceAfter =
      tx.balanceAfter !== null && tx.balanceAfter !== undefined && tx.balanceAfter !== ""
        ? (hidden ? "••••" : formatNumber(tx.balanceAfter) + " FCFA")
        : "—";

    const referenceRow = tx.reference
      ? `
        <div class="detail-row">
          <span>Référence</span>
          <span class="ref-line">
            <span class="val">${escapeHtml(tx.reference)}</span>
            <button type="button" class="copy-ref" data-copy="${escapeHtml(tx.reference)}" aria-label="Copier la référence">${ICON.copy}</button>
          </span>
        </div>`
      : "";

    const descriptionBlock =
      tx.description && tx.description !== tx.label
        ? `<div class="description">${escapeHtml(tx.description)}</div>`
        : "";

    return `
      <article class="transaction">

        <div class="tx-main">

          <div class="tx-icon ${tx.dir}">${ICON[iconKey] || ICON.other}</div>

          <div class="tx-info">
            <div class="tx-label">${escapeHtml(tx.label)}</div>
            <div class="tx-sub">${escapeHtml(sub)}</div>
          </div>

          <div class="tx-amount">
            <div class="amount ${tx.dir}">${amountText}</div>
            <span class="pill ${status.cls}">${escapeHtml(status.text)}</span>
          </div>

          ${ICON.chev}

        </div>

        <div class="tx-extra">
          <div class="details">

            <div class="detail-row">
              <span>Type</span>
              <span>${escapeHtml(KIND_LABELS[tx.kind])}</span>
            </div>

            ${referenceRow}

            <div class="detail-row">
              <span>Date</span>
              <span>${escapeHtml(formatFull(tx.date))}</span>
            </div>

            <div class="detail-row">
              <span>Statut</span>
              <span>${escapeHtml(status.text)}</span>
            </div>

            <div class="detail-row">
              <span>Solde après</span>
              <span>${balanceAfter}</span>
            </div>

          </div>

          ${descriptionBlock}
        </div>

      </article>
    `;
  }

  function renderList() {
    const container = $("transactions");
    const moreBtn = $("moreBtn");

    if (!loaded) return;

    const filtered = allTransactions.filter(tx => matchesFilter(tx) && matchesQuery(tx));
    const visible = filtered.slice(0, limit);

    $("visibleCount").textContent =
      filtered.length + (filtered.length > 1 ? " opérations" : " opération");

    moreBtn.hidden = filtered.length <= limit;

    if (!filtered.length) {
      const hasAny = allTransactions.length > 0;

      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">${ICON.empty}</div>
          <div class="empty-title">${hasAny ? "Aucun résultat" : "Aucune transaction"}</div>
          <div class="empty-text">${
            hasAny
              ? "Aucune opération ne correspond à votre recherche ou à ce filtre."
              : "Vos dépôts, retraits, revenus et achats apparaîtront ici."
          }</div>
        </div>
      `;
      return;
    }

    /* Regroupement par jour (liste déjà triée par date décroissante) */
    const groups = [];
    let current = null;

    visible.forEach(tx => {
      const key = dayKey(tx.date);

      if (!current || current.key !== key) {
        current = { key, label: dayLabel(tx.date), items: [] };
        groups.push(current);
      }

      current.items.push(tx);
    });

    container.innerHTML = groups.map(group => `
      <div class="day-title">${escapeHtml(group.label)}</div>
      <div class="day-group">
        ${group.items.map(transactionHtml).join("")}
      </div>
    `).join("");
  }

  /* ---------------- Interactions ---------------- */

  $("transactions").addEventListener("click", (event) => {
    const copyBtn = event.target.closest(".copy-ref");

    if (copyBtn) {
      event.stopPropagation();
      copyText(copyBtn.dataset.copy);
      return;
    }

    const card = event.target.closest(".transaction");
    if (card) card.classList.toggle("open");
  });

  $("filters").addEventListener("click", (event) => {
    const chip = event.target.closest(".chip");
    if (!chip) return;

    currentFilter = chip.dataset.filter;
    limit = PAGE_SIZE;

    document.querySelectorAll(".chip").forEach(c =>
      c.classList.toggle("active", c === chip)
    );

    renderList();
  });

  let searchTimer = null;

  $("search").addEventListener("input", (event) => {
    clearTimeout(searchTimer);

    searchTimer = setTimeout(() => {
      query = event.target.value.trim().toLowerCase();
      limit = PAGE_SIZE;
      renderList();
    }, 150);
  });

  $("moreBtn").addEventListener("click", () => {
    limit += PAGE_SIZE;
    renderList();
  });

  /* ---------------- Chargement ---------------- */

  function showError(text) {
    $("errorText").textContent = text;
    $("errorBox").classList.add("show");
  }

  async function loadTransactions() {
    $("errorBox").classList.remove("show");
    $("refreshBtn").classList.add("spin");

    try {
      const response = await fetch(DASHBOARD_URL, {
        method: "GET",
        headers: {
          "x-session-token": sessionToken,
          "Accept": "application/json"
        }
      });

      const data = await response.json().catch(() => ({}));

      if (response.status === 401) {
        sessionStorage.removeItem("hbd_session_token");
        sessionStorage.removeItem("hbd_user_id");
        window.location.replace(LOGIN_PAGE);
        return;
      }

      if (!response.ok) {
        throw new Error(data.error || data.message || "Impossible de charger vos transactions.");
      }

      const profile = data.profile || data.user || {};

      balance = Number(profile.balance ?? data.balance ?? 0);

      const list = Array.isArray(data.transactions) ? data.transactions : [];

      allTransactions = list
        .map(normalize)
        .sort((a, b) => {
          const da = parseDate(a.date)?.getTime() || 0;
          const db = parseDate(b.date)?.getTime() || 0;
          return db - da;
        });

      loaded = true;

      $("totalTransactions").textContent = allTransactions.length;
      $("lastActivity").textContent =
        allTransactions.length ? formatShort(allTransactions[0].date) : "—";

      renderBalance();
      renderList();

    } catch (error) {
      console.error(error);

      showError(error.message || "Une erreur est survenue.");
      $("visibleCount").textContent = "—";

      if (!loaded) {
        $("transactions").innerHTML = `
          <div class="empty">
            <div class="empty-icon">${ICON.empty}</div>
            <div class="empty-title">Chargement impossible</div>
            <div class="empty-text">Vérifiez votre connexion puis réessayez.</div>
          </div>
        `;
      }

    } finally {
      $("refreshBtn").classList.remove("spin");
    }
  }

  $("retryBtn").addEventListener("click", loadTransactions);
  $("refreshBtn").addEventListener("click", loadTransactions);

  /* ---------------- Initialisation ---------------- */

  renderBalance();

  if (!sessionToken) {
    window.location.replace(LOGIN_PAGE);
  } else {
    loadTransactions();
  }
</script>
